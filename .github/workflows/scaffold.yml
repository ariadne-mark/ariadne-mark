name: SDK and traceability checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Reviewed full commit SHA to qualify on the temporary EC2 runner
        required: true
        type: string
      qualification_mode:
        description: Source rebuild or unchanged published-package documentation qualification
        required: true
        default: source-build
        type: choice
        options:
          - source-build
          - published-package

permissions:
  contents: read

concurrency:
  group: ec2-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name == 'pull_request'
    name: Requirements traceability
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require successful EC2 evidence for this PR revision
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_ec2_qualification.py
  qualify:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'Genesius001' && github.repository == 'ariadne-mark/ariadne-mark'
    name: EC2 release qualification
    runs-on: ariadne-manual-qualified
    timeout-minutes: 90
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require the exact reviewed SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Qualify source build on EC2
        if: inputs.qualification_mode == 'source-build'
        run: bash scripts/ci_server.sh
      - name: Qualify unchanged published package on EC2
        if: inputs.qualification_mode == 'published-package'
        run: bash scripts/ci_published_package.sh
      - name: Retain evidence from this revision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-candidate-${{ github.sha }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 30
