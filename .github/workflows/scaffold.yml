name: SDK and traceability checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scaffold-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build distributable
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install wheel without dependencies
        run: python -m pip install --no-index --no-deps dist/*.whl
      - name: Test installed package
        run: python -m unittest discover -s tests -t . -v
      - name: Run integration example
        run: python examples/provenance_record.py
  media:
    name: CPU media integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build standalone CPU image
        run: docker build -t ariadne-mark:test .
      - name: Test real media offline
        run: >-
          docker run --rm --network none --cpus 2 --memory 6g
          --read-only --tmpfs /tmp:rw,noexec,nosuid,size=512m
          -e ARIADNE_MEDIA_TESTS=1 -w /app --entrypoint python
          ariadne-mark:test -m unittest discover -s tests -t . -v
  requirements:
    name: Requirements traceability
    needs: [sdk, media]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate requirement records
        run: python3 scripts/check_requirements.py
      - name: Require passing SDK checks
        env:
          SDK_RESULT: ${{ needs.sdk.result }}
          MEDIA_RESULT: ${{ needs.media.result }}
        run: test "$SDK_RESULT" = success && test "$MEDIA_RESULT" = success
