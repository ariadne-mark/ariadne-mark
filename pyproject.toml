[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadne-mark"
version = "0.7.0a0"
description = "Open-source labeling and provenance tools for AI-generated images and video"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY.md"]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
reports = ["cryptography==50.0.2"]
video = ["c2pa-python==0.38.3", "Pillow==13.0.0", "av==16.0.1", "cryptography==50.0.2"]
media = ["trustmark==0.9.2", "c2pa-python==0.38.3", "Pillow==13.0.0", "av==16.0.1", "cryptography==50.0.2"]

[project.scripts]
ariadne = "ariadne_mark.cli:main"

[project.urls]
Repository = "https://github.com/ariadne-mark/ariadne-mark"
Issues = "https://github.com/ariadne-mark/ariadne-mark/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ariadne_mark*"]
namespaces = false

[tool.setuptools.package-data]
ariadne_mark = ["py.typed", "c2pa-bootstrap.json", "bootstrap-linux-py312.lock", "verifier_assets/*"]

"ariadne_mark.watermark" = ["models.json"]

"ariadne_mark.profiles" = ["catalog.json"]

"ariadne_mark.videoq" = ["*.mjs", "*.json", "*.txt"]
