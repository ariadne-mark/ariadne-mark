# Reference HTTP upstream configuration. Terminate TLS at your public edge.
# Includes buffering, bounded per-client connections and request rate limits.
events {}
http {
    access_log off;
    limit_conn_zone $binary_remote_addr zone=clients:10m;
    limit_req_zone $binary_remote_addr zone=requests:10m rate=5r/s;
    server {
        listen 8080;
        client_max_body_size 512m;
        client_body_timeout 15s;
        limit_conn clients 4;
        location / {
            limit_req zone=requests burst=10 nodelay;
            proxy_request_buffering on;
            proxy_pass http://verifier:8080;
            proxy_read_timeout 300s;
            proxy_set_header Host $host;
            add_header Cache-Control no-store always;
        }
    }
}
