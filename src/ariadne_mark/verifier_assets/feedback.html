<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verification feedback · Ariadne Mark</title><link rel="stylesheet" href="/style.css"><script src="/feedback.js" defer></script></head><body><header class="site-header"><a class="wordmark" href="/">↳ Ariadne Mark</a><span class="eyebrow">ANONYMOUS FEEDBACK</span></header><main class="privacy-text"><h1>Help improve verification.</h1><p>Tell the operator which kind of result needs attention. Only aggregate category counts are stored; no contact details, files, IDs or free text are collected.</p><form id="feedback-form"><label for="media">Content type</label><select id="media" name="media"><option value="unknown">Not specified</option><option value="image">Image</option><option value="video">Video</option></select><p><label for="rating">What happened?</label><select id="rating" name="rating"><option value="unable_to_check">Could not complete a check</option><option value="incorrect_result">The result seemed incorrect</option><option value="correct_result">The result seemed correct</option></select></p><button id="submit-feedback" type="submit">Send anonymous feedback</button><p id="feedback-status" role="status" aria-live="polite"></p></form><p class="small"><a href="/privacy">How data is handled</a> · <a href="/">Check a file</a></p></main></body></html>
