worker_processes 1;
pid /tmp/nginx.pid;
# No access/error-request log retaining IPs, filenames or uploaded content.
error_log /dev/null;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size @@MAX_UPLOAD_MB@@m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 10s;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_read_timeout @@PROXY_TIMEOUT@@s;
    limit_conn_zone $binary_remote_addr zone=clients:1m;
    limit_req_zone $binary_remote_addr zone=requests:1m rate=5r/s;
    limit_req_status 429;
    limit_conn_status 429;
    server {
        listen 8080;
        @@HTTP_ROUTE@@
    }
    server {
        listen 8443 ssl;
        ssl_certificate /tls/cert.pem;
        ssl_certificate_key /tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:1m;
        ssl_session_tickets off;
        include /etc/nginx/kit-proxy.conf;
    }
}
